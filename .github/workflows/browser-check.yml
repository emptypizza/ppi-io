name: Verify deployed Firefox practice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-practice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Check the deployed practice game
        run: node tests/browser-practice.mjs --browser firefox --url https://emptypizza.github.io/ppi-io/ --output output/browser-practice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-practice-${{ github.run_id }}
          path: output/browser-practice
          retention-days: 1
          if-no-files-found: warn
